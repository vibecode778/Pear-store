<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Pear Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f7; --tile:#fbfbfd; --card:#ffffff;
  --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b; --line:#d2d2d7;
  --accent:#0071e3; --accent-h:#0077ed; --link:#0066cc;
  --nav:rgba(250,250,252,.8); --dark:#000; --dark-ink:#f5f5f7;
  --ok:#1a8f3c; --warn:#bf4800; --shadow:0 4px 24px rgba(0,0,0,.08);
  --r:18px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Inter",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000; --bg2:#101012; --tile:#161617; --card:#1c1c1e;
  --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#86868b; --line:#38383c;
  --accent:#0a84ff; --accent-h:#2997ff; --link:#2997ff;
  --nav:rgba(22,22,23,.8); --dark:#161617; --shadow:0 4px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000; --bg2:#101012; --tile:#161617; --card:#1c1c1e;
  --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#86868b; --line:#38383c;
  --accent:#0a84ff; --accent-h:#2997ff; --link:#2997ff;
  --nav:rgba(22,22,23,.8); --dark:#161617; --shadow:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.015em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:22px}
@media(max-width:600px){.wrap{padding-inline:16px}}
.num{font-variant-numeric:tabular-nums}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* nav */
.gnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.gnav .wrap{display:flex;align-items:center;gap:6px;height:48px}
.logo{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;font-size:17px;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo svg{width:20px;height:22px}
.navcats{display:flex;gap:2px;flex:1;justify-content:center;overflow:hidden}
.navcats a{color:var(--ink);opacity:.8;font-size:12px;padding:6px 8px;white-space:nowrap;border-radius:8px}
.navcats a:hover{opacity:1;text-decoration:none}
.navcats a.on{opacity:1;font-weight:600}
.navtools{display:flex;align-items:center;gap:2px;margin-left:auto}
.ib{position:relative;background:none;border:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--bg2)}
.ib svg{width:18px;height:18px}
.badge{position:absolute;top:3px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center}
.lang{display:flex;background:var(--bg2);border-radius:999px;padding:2px;margin-left:4px}
.lang button{border:0;background:none;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;color:var(--ink2)}
.lang button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.burger{display:none}
@media(max-width:1060px){.navcats{display:none}.burger{display:grid}}
.mobmenu{background:var(--bg);border-bottom:1px solid var(--line)}
.mobmenu .wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;padding-block:12px}
.mobmenu a{color:var(--ink);padding:10px 8px;border-radius:10px;font-size:15px}
.mobmenu a:hover{background:var(--bg2);text-decoration:none}

.searchbar{background:var(--bg);border-bottom:1px solid var(--line)}
.searchbar .wrap{padding-block:14px;display:flex;gap:10px;align-items:center}
.searchbar input{flex:1;border:0;background:var(--bg2);border-radius:12px;padding:12px 16px;font-size:17px;outline:none;min-width:0}
.searchbar input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}

.ribbon{background:var(--bg2);text-align:center;font-size:14px;padding:10px 16px;color:var(--ink)}

/* hero + tiles */
.hero{text-align:center;padding-block:56px 36px}
.hero h1{font-size:clamp(40px,7vw,72px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.hero p{font-size:clamp(19px,2.4vw,24px);color:var(--ink2);margin:14px auto 0;max-width:640px}
.eyebrow{font-size:14px;color:var(--warn);font-weight:600;letter-spacing:0;margin-bottom:6px}
.shopcats{display:flex;gap:26px;overflow-x:auto;padding-block:8px 28px;scrollbar-width:none;justify-content:flex-start}
.shopcats::-webkit-scrollbar{display:none}
.shopcats a{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:500;min-width:92px;text-align:center}
.shopcats a:hover{text-decoration:none}
.shopcats .ci{width:92px;height:72px;display:grid;place-items:center}
.shopcats .ci svg{width:80px;height:72px}
.shopcats a:hover .ci{transform:translateY(-3px);transition:transform .2s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{position:relative;border-radius:var(--r);overflow:hidden;background:var(--tile);text-align:center;padding:44px 24px 0;min-height:520px;display:flex;flex-direction:column;align-items:center}
.tile.full{grid-column:1/-1;min-height:560px}
.tile.dark{background:var(--dark);color:var(--dark-ink)}
.tile.dark .sub{color:#a1a1a6}
.tile.dark .btn.ghost{color:#2997ff;border-color:#2997ff}
.tile.dark .btn.ghost:hover{background:#2997ff;color:#fff}
.tile h2{font-size:clamp(32px,4.5vw,48px);font-weight:600}
.tile .sub{font-size:clamp(17px,2vw,21px);color:var(--ink2);margin-top:4px}
.tile .ctas{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tile .art{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:520px}
.tile .art svg{width:100%;max-height:340px}
@media(max-width:760px){.tiles{grid-template-columns:1fr}.tile{min-height:440px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:980px;background:var(--accent);color:#fff;font-size:15px;padding:9px 20px;font-weight:400;white-space:nowrap}
.btn:hover{background:var(--accent-h);text-decoration:none}
.btn.ghost{background:transparent;color:var(--link);border:1px solid var(--link)}
.btn.ghost:hover{background:var(--link);color:#fff}
.btn.lg{font-size:17px;padding:12px 28px}
.btn.gray{background:var(--bg2);color:var(--ink)}
.btn.gray:hover{background:var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}

.section{padding-block:56px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sechead h2{font-size:clamp(28px,3.6vw,40px);font-weight:600}
.sechead h2 span{color:var(--ink3)}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.perk{background:var(--tile);border-radius:var(--r);padding:26px 22px}
.perk svg{width:30px;height:30px;color:var(--accent)}
.perk h3{font-size:19px;margin-top:12px;font-weight:600}
.perk p{color:var(--ink2);font-size:15px;margin:6px 0 0}
@media(max-width:900px){.perks{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.perks{grid-template-columns:1fr}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.pc{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;position:relative}
.pc:hover{transform:scale(1.015);box-shadow:0 8px 34px rgba(0,0,0,.12)}
.pc .pimg{background:var(--bg2);border-radius:12px;aspect-ratio:1/0.82;display:grid;place-items:center;cursor:pointer;max-width:100%}
.pc .pimg svg{width:78%;height:88%}
.pc .brand{font-size:12px;color:var(--warn);font-weight:600;margin-top:14px;text-transform:uppercase;letter-spacing:.04em}
.pc h3{font-size:19px;font-weight:600;margin-top:2px;cursor:pointer}
.pc .tag{color:var(--ink2);font-size:14px;margin-top:4px;flex:1}
.pc .rate{font-size:13px;color:var(--ink3);margin-top:8px}
.pc .price{margin-top:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pc .price b{font-size:21px;font-weight:600}
.pc .price small{color:var(--ink3);font-size:14px}
.pc .inst{font-size:13px;color:var(--ink2)}
.pc .acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.pc .acts .btn{flex:1}
.tog{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink2);flex:none}
.tog svg{width:18px;height:18px}
.tog.on{color:var(--accent);border-color:var(--accent)}
.tog.fav.on{color:#e0245e;border-color:#e0245e}

/* category page */
.cathead{padding-block:40px 20px}
.cathead h1{font-size:clamp(36px,5vw,56px);font-weight:600}
.cathead p{color:var(--ink2);font-size:19px;margin:8px 0 0;max-width:680px}
.crumbs{font-size:13px;color:var(--ink3);margin-bottom:10px}
.crumbs a{color:var(--ink3)}
.catlay{display:grid;grid-template-columns:230px 1fr;gap:28px;padding-bottom:64px}
@media(max-width:860px){.catlay{grid-template-columns:1fr}}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;display:flex;flex-direction:column;gap:22px}
@media(max-width:860px){.filters{position:static;flex-direction:row;flex-wrap:wrap;gap:16px}}
.fgroup h4{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.fgroup label{display:flex;align-items:center;gap:8px;font-size:15px;padding:3px 0;cursor:pointer}
.fgroup input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.fgroup select,.fgroup input[type=number]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px}
.prange{display:flex;gap:8px}
.prange input{min-width:0}
.found{color:var(--ink2);font-size:15px;margin-bottom:14px}
.empty{padding:60px 20px;text-align:center;color:var(--ink2);background:var(--tile);border-radius:var(--r)}

/* product page */
.pp{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;padding-block:24px 40px}
@media(max-width:900px){.pp{grid-template-columns:1fr;gap:24px}}
.ppimg{background:var(--bg2);border-radius:24px;aspect-ratio:1/1;display:grid;place-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-width:100%}
@media(max-width:900px){.ppimg{position:static}}
.ppimg svg{width:80%;height:80%}
.swatches{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pp h1{font-size:clamp(32px,4vw,48px);font-weight:600;line-height:1.08}
.pp .lead{font-size:21px;color:var(--ink2);margin:10px 0 0}
.pp .about{color:var(--ink2);font-size:16px;margin:14px 0 0}
.pricebox{margin-top:24px;padding:22px;border-radius:var(--r);background:var(--tile);border:1px solid var(--line)}
.pricebox .big{font-size:32px;font-weight:600}
.pricebox .usd{color:var(--ink3);font-size:17px;margin-left:8px}
.stock{font-size:14px;color:var(--ok);margin-top:4px}
.ppacts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.ppacts .btn{flex:1;min-width:180px}
.calc{margin-top:22px;padding:22px;border-radius:var(--r);border:1px solid var(--line)}
.calc h3{font-size:19px;font-weight:600}
.calc .terms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.calc .terms button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;font-size:15px}
.calc .terms button.on{border:2px solid var(--accent);padding:9px 3px}
.calc .terms button small{display:block;font-size:11px;color:var(--ink3)}
.calc .res{display:flex;justify-content:space-between;margin-top:14px;font-size:15px;color:var(--ink2);flex-wrap:wrap;gap:6px}
.calc .res b{color:var(--ink);font-size:24px;font-weight:600}
.perkline{display:flex;flex-direction:column;gap:10px;margin-top:22px;font-size:15px}
.perkline div{display:flex;gap:10px;align-items:flex-start}
.perkline svg{width:20px;height:20px;flex:none;color:var(--ink2);margin-top:2px}
.specs{padding-block:40px;border-top:1px solid var(--line)}
.specs h2,.reviews h2{font-size:clamp(26px,3vw,32px);font-weight:600;margin-bottom:18px}
.spectable{width:100%;border-collapse:collapse;font-size:16px}
.spectable th,.spectable td{text-align:left;padding:14px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spectable th{font-weight:400;color:var(--ink2);width:40%;padding-right:16px}
.reviews{padding-block:40px 64px;border-top:1px solid var(--line)}
.revlay{display:grid;grid-template-columns:1fr 380px;gap:36px}
@media(max-width:900px){.revlay{grid-template-columns:1fr}}
.rev{padding:18px 0;border-bottom:1px solid var(--line)}
.rev .who{font-weight:600;font-size:15px}
.rev .when{color:var(--ink3);font-size:13px;margin-left:6px;font-weight:400}
.rev p{margin:6px 0 0;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.stars{color:#f5a623;letter-spacing:1px}
.revform{background:var(--tile);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;align-self:start}
.revform h3{font-size:19px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
.field textarea{min-height:96px;resize:vertical}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:26px;color:var(--line);padding:0 2px;line-height:1}
.starpick button.on{color:#f5a623}
.note{font-size:13px;color:var(--ink3)}
.formmsg{font-size:14px;color:var(--ok)}
.formerr{font-size:14px;color:var(--warn)}

/* compare */
.cmpwrap{overflow-x:auto;padding-bottom:10px}
.cmp{border-collapse:collapse;min-width:640px;width:100%;font-size:15px}
.cmp th,.cmp td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead td{text-align:center}
.cmp thead svg{width:120px;height:110px}
.cmp th{color:var(--ink2);font-weight:400;width:170px}
.cmp .x{background:none;border:0;color:var(--link);font-size:13px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;backdrop-filter:blur(4px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:90;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:24px;font-weight:600}
.dbody{flex:1;overflow-y:auto;padding:8px 20px}
.dfoot{padding:18px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.ci-row{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci-row .th{background:var(--bg2);border-radius:12px;width:72px;height:72px;display:grid;place-items:center}
.ci-row .th svg{width:60px;height:60px}
.ci-row h4{margin:0;font-size:16px;font-weight:600}
.ci-row .p{font-size:15px;margin-top:2px}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);line-height:1}
.qty .rm{margin-left:auto;border:0;width:auto;background:none;color:var(--link);font-size:14px}
.total{display:flex;justify-content:space-between;font-size:17px}
.total b{font-size:22px}
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--bg);border-radius:22px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{font-size:28px;font-weight:600}
.mbox form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.done{text-align:center;padding:10px 0}
.done svg{width:64px;height:64px;color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:15px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}

footer{background:var(--bg2);color:var(--ink2);font-size:12px;margin-top:24px}
footer .wrap{padding-block:30px}
.fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
@media(max-width:760px){.fcols{grid-template-columns:1fr 1fr}}
footer h5{color:var(--ink);font-size:12px;font-weight:600;margin:0 0 8px}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
footer a{color:var(--ink2)}
.fbottom{display:flex;justify-content:space-between;gap:12px;padding-top:16px;flex-wrap:wrap}
.copy{border:0;background:none;color:var(--link);font-size:12px;padding:0 0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<svg class="svgdefs" aria-hidden="true">
  <defs>
    <mask id="pearBite" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="26">
      <rect width="24" height="26" fill="#fff"/>
      <circle cx="21.2" cy="14.2" r="3.4" fill="#000"/>
    </mask>
    <symbol id="pear" viewBox="0 0 24 26">
      <path mask="url(#pearBite)" d="M12 5.2c-2.3 0-3.3 1.8-3.4 4-.1 2-1 3.1-2.3 4.6C4.9 15.4 4.4 16.9 4.4 18.4c0 4 3.4 6.8 7.6 6.8s7.6-2.8 7.6-6.8c0-1.5-.5-3-1.9-4.6-1.3-1.5-2.2-2.6-2.3-4.6-.1-2.2-1.1-4-3.4-4z"/>
      <path d="M12.6 4.6c.2-2.5 2.3-4 4.9-3.9-.1 2.6-2.2 4.1-4.9 3.9z"/>
    </symbol>
  </defs>
</svg>

<header class="gnav">

<script>

(function(){

const S={

const L=o=>o?(o[S.lang]||o.ru):'';
const PR=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const nb=' ';
const kzt=n=>Math.round(n).toLocaleString('ru-RU').replace(/\s/g,nb)+nb+'₸';
const usd=n=>'$'+Math.round(n/RATE).toLocaleString('en-US');

/* перевод значений характеристик */
function tv(v){
  v=String(v);
  if(S.lang==='ru')return v;
  const en=[[/^до (.+)$/,'up to $1'],[/ ч( |$)/g,' h$1'],[/ мин/g,' min'],[/ видео/,' video'],[/ на глаз/,' per eye'],[/ на ТВ/,' on TV'],[/ комплектов/,' place settings'],[/ насадок/,' attachments'],[/ насадки/,' attachments'],[/ режимов/,' modes'],[/ режима/,' modes'],[/ вспышек/,' flashes'],[/ скорости \+ импульс/,' speeds + pulse'],[/ в 1/,'-in-1']];
  const kk=[[/^до (.+)$/,'$1 дейін'],[/ ч( |$)/g,' сағ$1'],[/ видео/,' бейне'],[/ на глаз/,' әр көзге'],[/ на ТВ/,' ТВ-да'],[/ комплектов/,' жиынтық'],[/ насадок/,' саптама'],[/ насадки/,' саптама'],[/ режимов/,' режим'],[/ режима/,' режим'],[/ вспышек/,' жарқыл'],[/ скорости \+ импульс/,' жылдамдық + импульс'],[/ в 1/,' 1-де']];
  const words={en:{"Да":"Yes","Да, адаптивное":"Yes, adaptive","Накладные, Bluetooth 5.3":"Over-ear, Bluetooth 5.3","Автоматическая, капучинатор":"Automatic, milk frother","Автоменю 24":"24 auto menus","Холод/Тепло":"Cool/Heat","Очистка, обогрев, вентилятор":"Purify, heat, fan","Термостат, таймер":"Thermostat, timer","Тёплый / холодный пар":"Warm / cool mist","Роторная, Wet & Dry":"Rotary, Wet & Dry","Турбо / мягкий":"Turbo / gentle","Керамика":"Ceramic","Сухая + влажная уборка":"Vacuum + mop","LDS-навигация":"LDS navigation","Моющий":"Wet cleaning","Сменные стики, задние кнопки":"Swappable sticks, back buttons","Bluetooth, приложение":"Bluetooth, app","4, стеклокерамика":"4, ceramic glass","Midea":"Midea"},
    kk:{"Да":"Иә","Да, адаптивное":"Иә, адаптивті","Накладные, Bluetooth 5.3":"Жапсырмалы, Bluetooth 5.3","Автоматическая, капучинатор":"Автоматты, капучинатор","Автоменю 24":"24 автомәзір","Холод/Тепло":"Суық/Жылу","Очистка, обогрев, вентилятор":"Тазарту, жылыту, желдеткіш","Термостат, таймер":"Термостат, таймер","Тёплый / холодный пар":"Жылы / суық бу","Роторная, Wet & Dry":"Роторлы, Wet & Dry","Турбо / мягкий":"Турбо / жұмсақ","Керамика":"Керамика","Сухая + влажная уборка":"Құрғақ + ылғалды тазалау","LDS-навигация":"LDS навигация","Моющий":"Жуғыш","Сменные стики, задние кнопки":"Ауыстырмалы стиктер, артқы батырмалар","Bluetooth, приложение":"Bluetooth, қолданба","4, стеклокерамика":"4, шыны керамика"}};
  if(words[S.lang][v])return words[S.lang][v];
  (S.lang==='en'?en:kk).forEach(([a,b])=>{v=v.replace(a,b)});
  if(S.lang==='en')v=v.replace(/Wi-Fi, Холод\/Тепло/,'Wi-Fi, Cool/Heat');
  if(S.lang==='kk')v=v.replace(/Wi-Fi, Холод\/Тепло/,'Wi-Fi, Суық/Жылу');
  return v;
}

/* отзывы */
const allRev=pid=>[...S.sharedRev,...S.localRev].filter(r=>r.pid===pid).sort((a,b)=>b.ts-a.ts);
function rating(pid){const r=allRev(pid);if(!r.length)return null;return{avg:r.reduce((s,x)=>s+(+x.rating||0),0)/r.length,n:r.length}}
const starStr=a=>'★★★★★'.slice(0,Math.round(a))+'☆☆☆☆☆'.slice(0,5-Math.round(a));

/* иконки */
const IC={
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  cmp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4v16M17 4v16M3 8h8M13 16h8"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>'
};

/* карточка товара */
function card(p){
  const inC=S.cart[p.id],inF=S.fav.includes(p.id),inM=S.cmp.includes(p.id),r=rating(p.id);
  return `<article class="pc">
    <div class="pimg" data-go="p-${p.id}">${art(p.art,p.color)}</div>
    <div class="brand">${esc(p.brand)}</div>
    <h3 data-go="p-${p.id}">${esc(p.name)}</h3>
    <div class="tag">${esc(L(p.t))}</div>
    <div class="rate">${r?`<span class="stars">${starStr(r.avg)}</span> ${r.avg.toFixed(1)} · ${r.n} ${T('reviewsN')}`:`<span class="stars" style="color:var(--line)">★★★★★</span>`}</div>
    <div class="price num"><b>${kzt(p.price)}</b><small>${usd(p.price)}</small></div>
    <div class="inst num">${T('installFrom')} ${kzt(p.price/12)}${T('perMonth')}</div>
    <div class="acts">
      <button class="btn ${inC?'gray':''}" data-act="add" data-id="${p.id}">${inC?T('inCart'):T('toCart')}</button>
      <button class="tog fav ${inF?'on':''}" data-act="fav" data-id="${p.id}" aria-label="${T('addFav')}" aria-pressed="${inF}">${inF?IC.heartF:IC.heart}</button>
      <button class="tog ${inM?'on':''}" data-act="cmp" data-id="${p.id}" aria-label="${T('addCmp')}" aria-pressed="${inM}">${IC.cmp}</button>
    </div></article>`;
}

/* навигация и футер */
function chrome(){
  document.documentElement.lang=S.lang==='kk'?'kk':S.lang;
  const cur=S.route.startsWith('c-')?S.route.slice(2):S.route.startsWith('p-')?(PR[S.route.slice(2)]||{}).cat:'';
  const links=CATS.map(c=>`<a href="#c-${c.id}" class="${cur===c.id?'on':''}">${esc(L(c.n))}</a>`).join('');
  $('#navcats').innerHTML=links; $('#mobcats').innerHTML=links;

  $('#fcols').innerHTML=`
   <div><h5>${T('fShop')}</h5><ul>${CATS.map(c=>`<li><a href="#c-${c.id}">${esc(L(c.n))}</a></li>`).join('')}</ul></div>
   <div><h5>${T('fHelp')}</h5><ul><li>${T('fh1')}</li><li>${T('fh2')}</li><li>${T('fh3')}</li><li>${T('fh4')}</li></ul></div>
   <div><h5>${T('fAbout')}</h5><ul><li>${T('fa1')}</li><li>${T('fa2')}</li><li>${T('fa3')}</li></ul></div>
   <div><h5>${T('fContacts')}</h5><ul><li>${T('fc1')}</li><li>${T('fc2')}</li>
     <li><span id="phoneTxt">+7 700 000 00 00</span><button class="copy" data-act="copy" data-txt="+7 700 000 00 00">${T('copy')}</button></li>
     <li><span>hello@pearstore.kz</span><button class="copy" data-act="copy" data-txt="hello@pearstore.kz">${T('copy')}</button></li></ul></div>`;
  $('#fcopy').textContent=T('fcopy'); $('#fnote').textContent=T('fnote').replace('{r}',RATE);
}

/* страницы */
function viewHome(){
  const tile=(id,cls)=>{const p=PR[id];return `<div class="tile ${cls||''}">
    <div class="brand" style="font-size:13px;font-weight:600;color:${cls&&cls.includes('dark')?'#ff9f0a':'var(--warn)'}">${esc(p.brand)}</div>

  </div>`;
}

function filtered(cat){
  const f=S.filters[cat]||(S.filters[cat]={brands:[],min:'',max:'',sort:'pop'});
  let list=PRODUCTS.filter(p=>p.cat===cat);
  if(f.brands.length)list=list.filter(p=>f.brands.includes(p.brand));
  if(f.min!=='')list=list.filter(p=>p.price>=+f.min);
  if(f.max!=='')list=list.filter(p=>p.price<=+f.max);
  const rs=p=>(rating(p.id)||{avg:0}).avg;
  const srt={pop:(a,b)=>b.pop-a.pop,asc:(a,b)=>a.price-b.price,desc:(a,b)=>b.price-a.price,rate:(a,b)=>rs(b)-rs(a)||b.pop-a.pop,name:(a,b)=>a.name.localeCompare(b.name)};
  return {f,list:list.sort(srt[f.sort])};
}
function viewCat(cat){
  const c=CAT[cat]; if(!c)return viewHome();
  const {f,list}=filtered(cat);
  const brands=[...new Set(PRODUCTS.filter(p=>p.cat===cat).map(p=>p.brand))].sort();
  return `<div class="wrap fade">
   <div class="cathead"><div class="crumbs"><a href="#home">${T('home')}</a> › ${esc(L(c.n))}</div><h1>${esc(L(c.n))}</h1><p>${esc(L(c.d))}</p></div>
   <div class="catlay">
    <aside class="filters" aria-label="${T('filters')}">
      <div class="fgroup"><h4>${T('sort')}</h4><select id="fSort" data-cat="${cat}">

      <div class="fgroup"><h4>${T('brand')}</h4>${brands.map((b,ix)=>`<label><input type="checkbox" id="fb-${cat}-${ix}" data-brand="${esc(b)}" data-cat="${cat}" ${f.brands.includes(b)?'checked':''}> ${esc(b)}</label>`).join('')}</div>
      <div class="fgroup"><h4>${T('price')}</h4><div class="prange">
        <input type="number" id="fMin" data-cat="${cat}" placeholder="${T('min')}" value="${f.min}" inputmode="numeric" min="0" step="10000">
        <input type="number" id="fMax" data-cat="${cat}" placeholder="${T('max')}" value="${f.max}" inputmode="numeric" min="0" step="10000"></div></div>
      <div><button class="btn gray" data-act="freset" data-cat="${cat}">${T('reset')}</button></div>
    </aside>
    <div><div class="found num">${T('found')}: ${list.length}</div>
      ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">${T('nothing')}</div>`}</div>
   </div></div>`;
}

function calcHtml(p){
  const m=S.term[p.id]||12, over=m===24?.12:0, total=p.price*(1+over);
  return `<h3>${T('instTitle')}</h3>
   <div class="terms">${[3,6,12,24].map(k=>`<button class="${k===m?'on':''}" data-act="term" data-id="${p.id}" data-m="${k}">${k} ${T('months')}<small>${k===24?'+12%':'0%'}</small></button>`).join('')}</div>
   <div class="res num"><span>${T('monthly')}<br><b>${kzt(total/m)}</b></span><span style="text-align:right">${T('overpay')}: ${kzt(total-p.price)}<br>${T('total')}: ${kzt(total)}</span></div>
   <div class="note" style="margin-top:8px">${T('instNote')}</div>`;
}
function revListHtml(pid){
  const r=allRev(pid);
  if(!r.length)return `<p style="color:var(--ink2)">${T('noReviews')}</p>`;
  const loc={ru:'ru-RU',kk:'kk-KZ',en:'en-US'}[S.lang];
  return r.map(x=>`<div class="rev"><div><span class="stars">${starStr(+x.rating||0)}</span></div>
    <div class="who">${esc(x.name)}<span class="when">${new Date(x.ts).toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric'})}</span></div>
    <p>${esc(x.text)}</p></div>`).join('');
}
function viewProduct(id){
  const p=PR[id]; if(!p)return viewHome();
  const c=CAT[p.cat], inC=S.cart[p.id], inF=S.fav.includes(p.id), inM=S.cmp.includes(p.id), r=rating(p.id);
  const same=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).sort((a,b)=>b.pop-a.pop).slice(0,3);
  S.stars=0;
  return `<div class="wrap fade">
   <div class="crumbs" style="padding-top:22px"><a href="#home">${T('home')}</a> › <a href="#c-${c.id}">${esc(L(c.n))}</a> › ${esc(p.name)}</div>
   <div class="pp">
    <div><div class="ppimg">${art(p.art,p.color)}</div></div>
    <div>
      <div class="brand" style="color:var(--warn);font-weight:600;font-size:14px">${esc(p.brand)}</div>
      <h1>${esc(p.name)}</h1>
      <p class="lead">${esc(L(p.t))}</p>
      <div class="rate" style="margin-top:10px;font-size:14px;color:var(--ink3)" id="ppRate">${r?`<span class="stars">${starStr(r.avg)}</span> ${r.avg.toFixed(1)} · ${r.n} ${T('reviewsN')}`:T('noReviews')}</div>
      <p class="about">${esc(L(c.d))}</p>
      <div class="pricebox"><div><span class="big num">${kzt(p.price)}</span><span class="usd num">${T('priceUsd')} ${usd(p.price)}</span></div>
        <div class="stock">● ${T('inStock')}</div>
        <div class="ppacts">
          <button class="btn lg ${inC?'gray':''}" data-act="add" data-id="${p.id}">${inC?T('inCart'):T('toCart')}</button>
          <button class="btn lg gray" data-act="fav" data-id="${p.id}" aria-pressed="${inF}" style="flex:0 1 auto;min-width:0;color:${inF?'#e0245e':'inherit'}">${inF?'♥ '+T('inFav'):'♡ '+T('addFav')}</button>
          <button class="btn lg gray" data-act="cmp" data-id="${p.id}" aria-pressed="${inM}" style="flex:0 1 auto;min-width:0;${inM?'color:var(--accent)':''}">${inM?T('inCmp'):T('addCmp')}</button>
        </div></div>
      <div class="calc" id="calc">${calcHtml(p)}</div>
      <div class="perkline"><div>${IC.truck}<span>${T('deliv')}</span></div><div>${IC.store}<span>${T('pickup')}</span></div><div>${IC.shield}<span>${T('warranty')}</span></div></div>
    </div>
   </div>
   <section class="specs"><h2>${T('specs')}</h2>
     <table class="spectable"><tbody>${Object.entries(p.sp).map(([k,v])=>`<tr><th>${esc(L(SPEC[k])||k)}</th><td>${esc(tv(v))}</td></tr>`).join('')}
     <tr><th>${T('brand')}</th><td>${esc(p.brand)}</td></tr><tr><th>${L({ru:'Гарантия',kk:'Кепілдік',en:'Warranty'})}</th><td>12 ${T('months')}</td></tr></tbody></table></section>
   <section class="reviews"><h2>${T('reviews')}</h2>
     <div class="revlay"><div id="revlist">${revListHtml(p.id)}</div>
      <form class="revform" id="revform" data-id="${p.id}" novalidate>
        <h3>${T('writeReview')}</h3>
        <label class="field">${T('yourName')}<input id="rvName" maxlength="40" autocomplete="name"></label>
        <div class="field">${T('rating')}<div class="starpick" id="starpick">${[1,2,3,4,5].map(n=>`<button type="button" data-act="star" data-n="${n}" aria-label="${n}">★</button>`).join('')}</div></div>
        <label class="field">${T('yourText')}<textarea id="rvText" maxlength="1000"></textarea></label>
        <button class="btn" type="submit">${T('send')}</button>
        <div id="rvMsg" aria-live="polite"></div>
        <div class="note" id="rvNote">${S.db?T('revNote'):T('revNoteLocal')}</div>
      </form></div></section>
   <section class="section" style="border-top:1px solid var(--line)"><div class="sechead"><h2>${esc(L(c.n))}.</h2><a href="#c-${c.id}">${T('more')} ›</a></div>
     <div class="grid">${same.map(card).join('')}</div></section>
  </div>`;
}
function viewFav(){
  const list=S.fav.map(id=>PR[id]).filter(Boolean);
  return `<div class="wrap fade"><div class="cathead"><h1>${T('fav')}</h1></div>
   <div style="padding-bottom:64px">${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">${T('favEmpty')}</div>`}</div></div>`;
}
function viewCompare(){
  const list=S.cmp.map(id=>PR[id]).filter(Boolean);
  if(!list.length)return `<div class="wrap fade"><div class="cathead"><h1>${T('compare')}</h1></div><div class="empty" style="margin-bottom:64px">${T('cmpEmpty')}</div></div>`;
  const keys=[...new Set(list.flatMap(p=>Object.keys(p.sp)))];
  return `<div class="wrap fade"><div class="cathead" style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><h1>${T('compare')}</h1><button class="btn gray" data-act="cmpclear">${T('clear')}</button></div>
   <div class="cmpwrap" style="padding-bottom:64px"><table class="cmp"><thead><tr><th></th>${list.map(p=>`<td><div data-go="p-${p.id}" style="cursor:pointer">${art(p.art,p.color)}</div><div style="font-weight:600">${esc(p.name)}</div><button class="x" data-act="cmp" data-id="${p.id}">${T('remove')}</button></td>`).join('')}</tr></thead>
   <tbody>
    <tr><th>${T('price2')}</th>${list.map(p=>`<td class="num"><b>${kzt(p.price)}</b><br><span style="color:var(--ink3)">${usd(p.price)}</span></td>`).join('')}</tr>
    <tr><th>${T('brand')}</th>${list.map(p=>`<td>${esc(p.brand)}</td>`).join('')}</tr>
    <tr><th>${T('category')}</th>${list.map(p=>`<td>${esc(L(CAT[p.cat].n))}</td>`).join('')}</tr>
    ${keys.map(k=>`<tr><th>${esc(L(SPEC[k]))}</th>${list.map(p=>`<td>${p.sp[k]?esc(tv(p.sp[k])):'—'}</td>`).join('')}</tr>`).join('')}
    <tr><th></th>${list.map(p=>`<td><button class="btn" data-act="add" data-id="${p.id}">${S.cart[p.id]?T('inCart'):T('toCart')}</button></td>`).join('')}</tr>
   </tbody></table></div></div>`;
}
function viewSearch(){
  const q=S.q.trim().toLowerCase();
  const list=q?PRODUCTS.filter(p=>[p.name,p.brand,L(CAT[p.cat].n),L(p.t)].join(' ').toLowerCase().includes(q)):[];
  return `<div class="wrap fade"><div class="cathead"><h1>${T('results')}</h1>${q?`<p>${T('resultsFor')} «${esc(S.q)}» · ${list.length}</p>`:''}</div>
   <div style="padding-bottom:64px">${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">${T('nothing')}</div>`}</div></div>`;
}

function render(keepScroll){
  const r=S.route; let html;
  if(r.startsWith('c-'))html=viewCat(r.slice(2));
  else if(r.startsWith('p-'))html=viewProduct(r.slice(2));
  else if(r==='fav')html=viewFav();
  else if(r==='compare')html=viewCompare();
  else if(r==='search')html=viewSearch();
  else html=viewHome();
  const y=window.scrollY;
  $('#app').innerHTML=html; chrome();
  if(keepScroll)window.scrollTo(0,y);
  const title={fav:T('fav'),compare:T('compare'),search:T('results')}[r]||(r.startsWith('c-')&&CAT[r.slice(2)]?L(CAT[r.slice(2)].n):r.startsWith('p-')&&PR[r.slice(2)]?PR[r.slice(2)].name:'');
  document.title=title?`${title} — Pear Store`:'Pear Store';
}
function go(){
  S.route=(location.hash||'#home').slice(1)||'home';
  $('#mobmenu').hidden=true;
  render(); window.scrollTo(0,0);
}

/* корзина */
function openCart(){
  const ids=Object.keys(S.cart).filter(id=>PR[id]);
  const sum=ids.reduce((s,id)=>s+PR[id].price*S.cart[id],0);
  $('#overlay').innerHTML=`<div class="scrim" data-act="close"></div>
   <aside class="drawer" role="dialog" aria-modal="true" aria-label="${T('cart')}">
    <div class="dhead"><h2>${T('cart')}</h2><button class="ib" data-act="close" aria-label="${T('close')}">✕</button></div>
    <div class="dbody">${ids.length?ids.map(id=>{const p=PR[id];return `<div class="ci-row"><div class="th">${art(p.art,p.color)}</div><div>
      <h4>${esc(p.name)}</h4><div class="p num">${kzt(p.price*S.cart[id])} <span style="color:var(--ink3);font-size:13px">${usd(p.price*S.cart[id])}</span></div>
      <div class="qty"><button data-act="dec" data-id="${id}" aria-label="−">−</button><span class="num">${S.cart[id]}</span><button data-act="inc" data-id="${id}" aria-label="+">+</button><button class="rm" data-act="rm" data-id="${id}">${T('remove')}</button></div></div></div>`}).join(''):`<p style="color:var(--ink2);padding:30px 0;text-align:center">${T('cartEmpty')}</p>`}</div>
    ${ids.length?`<div class="dfoot"><div class="total num"><span>${T('sum')}</span><span style="text-align:right"><b>${kzt(sum)}</b><br><span style="color:var(--ink3);font-size:14px">${usd(sum)} · ${T('installFrom').toLowerCase()} ${kzt(sum/12)}${T('perMonth')}</span></span></div>
      <button class="btn lg" data-act="checkout">${T('checkout')}</button></div>`:''}
   </aside>`;
}
function openCheckout(){
  const ids=Object.keys(S.cart).filter(id=>PR[id]);
  const sum=ids.reduce((s,id)=>s+PR[id].price*S.cart[id],0);
  const cities=['Алматы','Астана','Шымкент','Караганда','Актобе','Павлодар','Усть-Каменогорск','Кокшетау','Атырау','Костанай'];
  $('#overlay').innerHTML=`<div class="scrim" data-act="close"></div>
   <div class="modal" data-act="closeout"><div class="mbox" role="dialog" aria-modal="true" aria-label="${T('ckTitle')}">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>${T('ckTitle')}</h2><button class="ib" data-act="close" aria-label="${T('close')}">✕</button></div>
    <form id="ckform" novalidate>
      <div class="row2"><label class="field">${T('name')}<input id="ckName" autocomplete="name" value="Айгерим Садыкова"></label>
      <label class="field">${T('phone')}<input id="ckPhone" type="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __"></label></div>
      <div class="row2"><label class="field">${T('city')}<select id="ckCity">${cities.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="field">${T('address')}<input id="ckAddr" autocomplete="street-address"></label></div>
      <div class="field">${T('delivery')}<div class="seg"><label><input type="radio" name="dl" id="dl1" checked>${T('dCourier')}</label><label><input type="radio" name="dl" id="dl2">${T('dPickup')}</label></div></div>
      <div class="field">${T('payment')}<div class="seg"><label><input type="radio" name="pm" id="pm1" checked>${T('payCard')}</label><label><input type="radio" name="pm" id="pm2">${T('payInst')}</label><label><input type="radio" name="pm" id="pm3">${T('payCash')}</label></div></div>
      <label class="field">${T('comment')}<textarea id="ckCom" style="min-height:64px"></textarea></label>
      <div class="total num"><span>${T('total')}</span><b>${kzt(sum)}</b></div>
      <button class="btn lg" type="submit">${T('placeOrder')}</button>
      <div id="ckMsg" aria-live="polite"></div>
      <div class="note">${T('demoNote')}</div>
    </form></div></div>`;
}
function closeOverlay(){$('#overlay').innerHTML=''}

let tt;function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,1900)}
function refresh(){ // перерисовать текущую страницу без прокрутки и сохранить
  save(); render(true);
}

/* события */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){location.hash=g.dataset.go;return}
  const a=e.target.closest('[data-act]'); if(!a)return;
  const id=a.dataset.id, act=a.dataset.act;
  if(act==='closeout'&&e.target!==a)return;
  switch(act){
    case'add': if(!S.cart[id]){S.cart[id]=1;toast(T('added'))} else openCart(); refresh(); break;
    case'fav': {const i=S.fav.indexOf(id); if(i<0){S.fav.push(id);toast(T('favAdded'))}else S.fav.splice(i,1); refresh(); break;}
    case'cmp': {const i=S.cmp.indexOf(id); if(i<0){if(S.cmp.length>=4){toast(T('cmpMax'));break}S.cmp.push(id);toast(T('cmpAdded'))}else S.cmp.splice(i,1); refresh(); break;}
    case'cmpclear': S.cmp=[]; refresh(); break;
    case'inc': S.cart[id]++; save(); chrome(); openCart(); break;
    case'dec': if(--S.cart[id]<=0)delete S.cart[id]; save(); render(true); openCart(); break;
    case'rm': delete S.cart[id]; save(); render(true); openCart(); break;
    case'close': case'closeout': closeOverlay(); break;
    case'checkout': openCheckout(); break;
    case'term': S.term[id]=+a.dataset.m; $('#calc').innerHTML=calcHtml(PR[id]); break;
    case'star': S.stars=+a.dataset.n; document.querySelectorAll('#starpick button').forEach(b=>b.classList.toggle('on',+b.dataset.n<=S.stars)); break;
    case'freset': S.filters[a.dataset.cat]={brands:[],min:'',max:'',sort:'pop'}; render(true); break;
    case'copy': {const txt=a.dataset.txt; const done=()=>toast(T('copied'));
      try{navigator.clipboard.writeText(txt).then(done,()=>selectText(a.previousElementSibling))}catch(err){selectText(a.previousElementSibling)} break;}
  }
});
function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
document.addEventListener('change',e=>{
  const t=e.target, cat=t.dataset&&t.dataset.cat; if(!cat)return;
  const f=S.filters[cat];
  if(t.id==='fSort')f.sort=t.value;
  else if(t.dataset.brand){const b=t.dataset.brand;t.checked?f.brands.push(b):f.brands.splice(f.brands.indexOf(b),1)}
  else if(t.id==='fMin')f.min=t.value;
  else if(t.id==='fMax')f.max=t.value;
  render(true);
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='revform'){
    const name=$('#rvName').value.trim(), text=$('#rvText').value.trim(), msg=$('#rvMsg');
    if(!name||!text||!S.stars){msg.className='formerr';msg.textContent=T('revNeed');return}
    const rv={pid:f.dataset.id,name:name.slice(0,40),rating:S.stars,text:text.slice(0,1000),ts:Date.now()};
    let shared=false;
    if(S.db){try{await S.db.collection('reviews').add(rv);shared=true}catch(err){shared=false}}
    if(!shared){S.localRev.push(rv);LS.set('rev',S.localRev)}
    else if(!S.sharedRev.some(x=>x.ts===rv.ts&&x.name===rv.name))S.sharedRev.push(rv);
    $('#rvName').value='';$('#rvText').value='';S.stars=0;document.querySelectorAll('#starpick button').forEach(b=>b.classList.remove('on'));
    msg.className='formmsg';msg.textContent=shared?T('revShared'):T('revLocal');
    updateReviews();
  }
  if(f.id==='ckform'){
    const name=$('#ckName').value.trim(),phone=$('#ckPhone').value.trim(),m=$('#ckMsg');
    if(!name||phone.replace(/\D/g,'').length<10){m.className='formerr';m.textContent=T('ckNeed');return}
    const n='PS-'+String(Date.now()).slice(-6);
    S.cart={}; save(); render(true);
    $('.mbox').innerHTML=`<div class="done">${IC.check}<h2 style="margin-top:12px">${T('ckDone')}</h2><p style="color:var(--ink2)">${T('ckDoneSub').replace('{n}',n)}</p><button class="btn lg" data-act="close">${T('close')}</button><p class="note">${T('demoNote')}</p></div>`;
  }
});
function updateReviews(){
  if(!S.route.startsWith('p-'))return render(true);
  const pid=S.route.slice(2), l=$('#revlist'), r=rating(pid), pr=$('#ppRate');
  if(l)l.innerHTML=revListHtml(pid);
  if(pr)pr.innerHTML=r?`<span class="stars">${starStr(r.avg)}</span> ${r.avg.toFixed(1)} · ${r.n} ${T('reviewsN')}`:T('noReviews');
}

document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.l;save();render(true)}));
$('#bCart').addEventListener('click',openCart);
$('#bMenu').addEventListener('click',()=>{$('#mobmenu').hidden=!$('#mobmenu').hidden});
$('#bSearch').addEventListener('click',()=>{const sb=$('#searchbar');sb.hidden=!sb.hidden;if(!sb.hidden)$('#q').focus()});
$('#qClose').addEventListener('click',()=>{$('#searchbar').hidden=true});
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(S.route!=='search'){location.hash='search'}else render(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlay();$('#searchbar').hidden=true}});
window.addEventListener('hashchange',go);

/* общий доступ к отзывам */
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db'); if(!db)return;
    S.db=db; const note=$('#rvNote'); if(note)note.textContent=T('revNote');
    db.collection('reviews').onSnapshot(snap=>{
      S.sharedRev=snap.docs.map(d=>d.data()).filter(x=>x&&x.pid&&x.name&&x.text);
      if(S.route.startsWith('p-'))updateReviews();
      else if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render(true);
    },()=>{});
  }catch(e){}
})();

go();
})();

</script>

</body>
</html>
